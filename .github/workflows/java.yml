name: Java CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_SENHA: ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Criar banco de testes
        run: mysql -h 127.0.0.1 -uroot -pci_password < database/scripts/schema.sql

      - name: Compilar e testar com display virtual
        run: xvfb-run -a mvn --batch-mode verify
